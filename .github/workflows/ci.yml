name: ci
on:
  pull_request:
  push:
    branches: [main, 'track-a/**', 'track-b/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
  ownership:
    # Only feature PRs into a track branch; integration PRs into main must resolve shared files.
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'track-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
      - run: scripts/check-ownership.sh origin/main '${{ github.head_ref }}'
